[project]
name = "tokenthrift"
version = "0.1.0"
description = "High-speed ML-driven context pruning for RAG"
readme = "README.md"
license = "MIT"
authors = [
    { email = "sabiq.khan201@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "streamlit>=1.61.1",
    "tiktoken>=0.14.0",
    "uvicorn>=0.52.3",
]

[project.urls]
Homepage = "https://github.com/skn47/token-thrift"
Repository = "https://github.com/skn47/token-thrift"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_corpus.py" = ["ISC004"]
"scripts/generate_corpus_nimbus.py" = ["ISC004"]
